name: Runtime control candidate
on:
  push:
    branches: [plan29-runtime-control]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Check application and runtime tests
        run: |
          python -m compileall -q app
          python -m unittest discover -s tests -v
      - name: Free runner disk for the pinned ROCm base
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the candidate application layer
        id: candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runtime-control
          platforms: linux/amd64
          push: true
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: ghcr.io/otama-homelab/image-studio:runtime-control-${{ github.sha }}
      - name: Record immutable candidate identity
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          printf 'Candidate digest: `%s`\n' "$CANDIDATE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
