<div class="palette">
  <div class="palette-heading"><span>背景の色</span><span class="color-name"></span></div>
  <div class="swatches" role="group" aria-label="背景色のテンプレート">
    <button type="button" class="swatch" data-color="#F5F3EF" data-name="オフホワイト" aria-label="オフホワイト" aria-pressed="true"><span style="background:#F5F3EF"></span><small>オフホワイト</small></button>
    <button type="button" class="swatch" data-color="#FFFFFF" data-name="白" aria-label="白" aria-pressed="false"><span style="background:#FFFFFF"></span><small>白</small></button>
    <button type="button" class="swatch" data-color="#8EC5FF" data-name="青" aria-label="青" aria-pressed="false"><span style="background:#8EC5FF"></span><small>青</small></button>
    <button type="button" class="swatch" data-color="#DDDDDD" data-name="グレー" aria-label="グレー" aria-pressed="false"><span style="background:#DDDDDD"></span><small>グレー</small></button>
  </div>
  <label class="custom-color"><span>好きな色を選ぶ</span><span class="custom-color-control"><span class="hex-value"></span><input type="color" aria-label="カラーパレット" value="#F5F3EF"></span></label>
</div>
