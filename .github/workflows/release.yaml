name: Release image
on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${RELEASE_TAG#v}" = "$(cat VERSION)"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Check application syntax
        run: python -m compileall -q app
      - name: Free runner disk for ROCm wheels
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/otama-homelab/image-studio:buildcache
          cache-to: type=registry,ref=ghcr.io/otama-homelab/image-studio:buildcache,mode=max
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/otama-homelab/image-studio:${{ steps.version.outputs.version }}
            ghcr.io/otama-homelab/image-studio:latest
      - name: Record release digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Container: `ghcr.io/otama-homelab/image-studio:%s`\n\nDigest: `%s`\n' "${RELEASE_TAG#v}" "$IMAGE_DIGEST" > /tmp/release-notes.md
          gh release create "$RELEASE_TAG" --title "Image Studio $RELEASE_TAG" --notes-file /tmp/release-notes.md
